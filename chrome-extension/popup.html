<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ヌケバイ Reporter</title>
  <!-- Firebase SDK は MV3 準拠のためローカル同梱(vendor/)を使用 -->
  <script src="vendor/firebase-app-compat.js"></script>
  <script src="vendor/firebase-auth-compat.js"></script>
  <script src="vendor/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <style>
    body { font-family: sans-serif; width: 350px; padding: 15px; font-size: 14px; }
    h3 { margin-top: 0; color: #333; }
    .field-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; color: #555; }
    input[type='text'], input[type='email'], input[type='password'], textarea {
      width: 95%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    textarea { min-height: 60px; }
    .checkbox-group label { font-weight: normal; margin-bottom: 2px; display: flex; align-items: center; }
    .checkbox-group input[type='checkbox'] { margin-right: 8px; }
    .checkbox-group {
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid #eee;
      padding: 5px;
      margin-top: 4px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background-color: #0056b3; }
    #reportButton {
      background-color: #dc3545;
      border-color: #dc3545;
    }
    #reportButton:hover {
      background-color: #c82333;
      border-color: #bd2130;
    }
    #authBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
      font-size: 0.85em;
      color: #555;
    }
    #logoutButton {
      width: auto;
      padding: 4px 10px;
      font-size: 12px;
      background-color: #6c757d;
    }
    #logoutButton:hover { background-color: #545b62; }
    .google-btn {
      background-color: #4285f4;
    }
    .google-btn:hover { background-color: #357ae8; }
    .or-divider {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin: 10px 0;
      position: relative;
    }
    .or-divider span { background: #fff; padding: 0 8px; }
    .or-divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: #eee;
      z-index: -1;
    }
    .error-text { color: #dc3545; font-size: 0.85em; margin-top: 6px; }
    .muted { color: #888; font-size: 0.85em; }
    a { color: #007bff; }
  </style>
</head>
<body>
  <!-- 読み込み中 -->
  <div id="loadingView" style="text-align: center; padding: 20px;">
    <p class="muted">読み込み中...</p>
  </div>

  <!-- 未ログイン: ログインフォーム -->
  <div id="loginView" style="display: none;">
    <h3>ヌケバイにログイン</h3>
    <div class="field-group">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" placeholder="メールアドレス">
    </div>
    <div class="field-group">
      <label for="password">パスワード</label>
      <input type="password" id="password" placeholder="パスワード">
    </div>
    <button id="loginButton">ログイン</button>
    <div class="or-divider"><span>または</span></div>
    <button id="googleLoginButton" class="google-btn">Googleでログイン</button>
    <div id="loginError" class="error-text" style="display: none;"></div>
    <p class="muted" style="margin-top: 12px;">
      アカウントをお持ちでない場合は
      <a href="https://nukebuy.web.app/register" target="_blank" rel="noopener">こちら</a>
      から登録してください。
    </p>
    <p class="muted" id="redirectHint" style="margin-top: 10px; word-break: break-all;"></p>
  </div>

  <!-- ログイン済み: 報告フォーム -->
  <div id="appView" style="display: none;">
    <div id="authBar">
      <span id="currentUserEmail"></span>
      <button id="logoutButton">ログアウト</button>
    </div>

    <div id="reportForm">
      <div class="field-group">
        <label for="videoId">動画のID</label>
        <input type="text" id="videoId" placeholder="例: ABCD-123">
      </div>

      <div class="field-group">
        <label for="videoTitle">動画タイトル(任意)</label>
        <input type="text" id="videoTitle" placeholder="分かれば入力(任意)">
      </div>

      <div class="field-group">
        <label>抜けない理由</label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="reason" value="MALE_MASK"> 男優マスクor目出し帽</label>
          <label><input type="checkbox" name="reason" value="FAT_MALE"> 太っている男優</label>
          <label><input type="checkbox" name="reason" value="FEMALE_MASK"> 女優マスク</label>
          <label><input type="checkbox" name="reason" value="VOICE_QUALITY"> 男優・女優の声質</label>
          <label><input type="checkbox" name="reason" value="OVER_ACTING"> 男優・女優の演技が演技感ありすぎる</label>
          <label><input type="checkbox" name="reason" value="LONG_OPENING"> OPトークが長い・つまらなさすぎる</label>
          <label><input type="checkbox" name="reason" value="UNNECESSARY_TALK"> 挿入中に不必要な話をしてる</label>
          <label><input type="checkbox" name="reason" value="PASSIVE_FEMALE"> 女優がマグロ過ぎる</label>
          <label><input type="checkbox" name="reason" value="FAKE_CUM"> 偽汁(疑似精子)</label>
          <label><input type="checkbox" name="reason" value="BAD_QUALITY"> 画質・音声が悪い</label>
          <label><input type="checkbox" name="reason" value="STUDIO_LIKE"> 撮影場所がスタジオ過ぎる</label>
          <label><input type="checkbox" name="reason" value="BAD_CAMERA"> カメラワークが悪い</label>
          <label><input type="checkbox" name="reason" value="SHORT_SEX"> 挿入シーン短すぎ(前戯長すぎ)</label>
          <label><input type="checkbox" name="reason" value="WRONG_POSITION_ORDER"> フィニッシュまでの体位の順番がおかしい</label>
        </div>
      </div>

      <button id="reportButton">報告</button>
      <div id="reportError" class="error-text" style="display: none;"></div>
    </div>

    <div id="successMessage" style="display: none; text-align: center; padding: 20px;">
      <p style="font-size: 16px; color: green;">報告ありがとうございます！</p>
      <p class="muted">ポイントが付与されました。</p>
      <button id="reportAgainButton" style="margin-top: 10px;">続けて報告する</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
